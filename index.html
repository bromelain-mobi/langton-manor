<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
		<title>The Secret of Langton Manor</title>
		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

html, body {
	position: fixed;
	top: 0;
	left: 0;
	width: 100%;
	height: 100%;
	overflow: hidden;
	overscroll-behavior: none;
}

body {
	color: white;
	background-color: black;
	touch-action: none;
}

#canvas {
	display: block;
	width: 100%;
	height: 100%;
}

#orientation-lock {
	display: none;
}

@media screen and (orientation: landscape) and (pointer: coarse) {
	#orientation-lock {
		display: flex;
		position: fixed;
		top: 0;
		left: 0;
		width: 100%;
		height: 100%;
		z-index: 100;
		box-sizing: border-box;
		padding: 2rem;
		flex-direction: column;
		align-items: center;
		justify-content: center;
		text-align: center;
		background-color: #111;
		color: #e0e0e0;
		font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	}

	#orientation-lock .rotate-icon {
		font-size: 3rem;
		margin-bottom: 1rem;
	}

	#canvas {
		visibility: hidden;
	}
}

#canvas:focus {
	outline: none;
}

#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}

#status, #status-splash {
	top: 0;
	bottom: 0;
}

#status {
	background-color: #242424;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
}

#status-splash {
	max-height: 100%;
	max-width: 100%;
	margin: auto;
}

#status-progress, #status-notice {
	display: none;
}

#status-progress {
	bottom: 10%;
	width: 50%;
	margin: 0 auto;
}

#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}
		</style>
		<link id='-gd-engine-icon' rel='icon' type='image/png' href='index.icon.png' />
<link rel='apple-touch-icon' href='index.apple-touch-icon.png'/>
<link rel='manifest' href='index.manifest.json'>
<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

	<body>
		<canvas id="canvas">
			Your browser does not support the canvas tag.
		</canvas>

		<div id="orientation-lock">
			<div class="rotate-icon">&#8635;</div>
			<div>Please rotate your device back to portrait.</div>
		</div>

		<noscript>
			Your browser does not support JavaScript.
		</noscript>

		<div id="status">	
			<progress id="status-progress"></progress>
			
			<div id="status-message" style="margin-top: 10px; font-family: sans-serif; color: #888;">Downloading...</div>

			<div id="status-notice"></div>
		</div>

		<script src="index.js"></script>
		<script>
if (navigator.audioSession) {
	navigator.audioSession.type = 'playback';
}

if ('wakeLock' in navigator) {
	(function () {
		let wakeLock = null;
		let requesting = false;

		function keepAwake() {
			if (wakeLock !== null || requesting || document.visibilityState !== 'visible') {
				return;
			}
			requesting = true;
			navigator.wakeLock.request('screen').then(function (lock) {
				wakeLock = lock;
				lock.addEventListener('release', function () {
					wakeLock = null;
				});
			}).catch(function () {
			}).then(function () {
				requesting = false;
			});
		}

		window.addEventListener('pointerup', keepAwake, true);
		document.addEventListener('visibilitychange', keepAwake);
		keepAwake();
	}());
}

var engine = new Engine({"args":[],"canvasResizePolicy":2,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":8693360,"index.wasm":19796835},"focusCanvas":true,"gdnativeLibs":[],"serviceWorker":"index.service.worker.js"});

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');
	const statusMessage = document.getElementById('status-message');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function displayFailureNotice(err) {
		console.error(err);
		var msg = err.message || err;
		statusNotice.innerText = msg;
		setStatusMode('notice');
		initializing = false;
	}

	(function () {
		const canvas = document.getElementById('canvas');
		let settleTimer = null;
		let frozen = false;

		function viewportSize() {
			return {
				w: document.documentElement.clientWidth,
				h: document.documentElement.clientHeight,
			};
		}

		function freeze() {
			if (frozen) {
				return;
			}
			const s = viewportSize();
			canvas.style.width = s.w + 'px';
			canvas.style.height = s.h + 'px';
			frozen = true;
		}

		function settle() {
			frozen = false;
			canvas.style.width = '100%';
			canvas.style.height = '100%';
		}

		function onViewportChange() {
			freeze();
			if (settleTimer !== null) {
				clearTimeout(settleTimer);
			}
			settleTimer = setTimeout(function () {
				settleTimer = null;
				settle();
			}, 350);
		}

		window.addEventListener('orientationchange', onViewportChange);
		window.addEventListener('resize', onViewportChange);
		if (window.visualViewport) {
			window.visualViewport.addEventListener('resize', onViewportChange);
		}
	}());

	if ('serviceWorker' in navigator) {
		let updating = false;

		function applyUpdate(worker) {
			if (updating || !initializing || !navigator.serviceWorker.controller) {
				return;
			}
			updating = true;
			worker.postMessage('claim');
		}

		function watchInstall(worker) {
			if (!worker) {
				return;
			}
			if (worker.state === 'installed') {
				applyUpdate(worker);
				return;
			}
			worker.addEventListener('statechange', function () {
				if (worker.state === 'installed') {
					applyUpdate(worker);
				}
			});
		}

		navigator.serviceWorker.addEventListener('controllerchange', function () {
			if (updating) {
				window.location.reload();
			}
		});

		navigator.serviceWorker.register('index.service.worker.js')
			.then(function (reg) {
				console.log('SW Registered!', reg);
				watchInstall(reg.waiting);
				watchInstall(reg.installing);
				reg.addEventListener('updatefound', function () {
					watchInstall(reg.installing);
				});
				if (navigator.serviceWorker.controller) {
					reg.update().catch(function () {});
				}
			})
			.catch(err => console.log('SW Failed:', err));
	}

	setStatusMode('progress');
	
	engine.startGame({
		'onProgress': function (current, total) {
			if (current > 0 && total > 0) {
				statusProgress.value = current;
				statusProgress.max = total;
				
				let percent = Math.floor((current / total) * 100);
				
				if (percent >= 100) {
					statusMessage.innerHTML = "Initializing engine... this may take a minute.<br>Please wait.";
					statusMessage.style.color = "#e0e0e0";
				} else {
					statusMessage.innerText = "Downloading game files (" + percent + "%)";
				}

			} else {
				statusProgress.removeAttribute('value');
				statusProgress.removeAttribute('max');
				statusMessage.innerText = "Preparing...";
			}
		},
	}).then(() => {
		setStatusMode('hidden');
	}, displayFailureNotice);
}());
		</script>
	</body>
</html>
